<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสินค้าและโปรโมชั่น</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 40px;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-lock {
            background: #e2e8f0;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .btn-lock.active {
            background: #dbeafe;
            color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border);
            height: fit-content;
        }

        .sidebar-title {
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cat-item-btn {
            padding: 8px;
            margin: 4px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .cat-item-btn:hover {
            background: #f1f5f9;
        }

        details {
            margin-bottom: 6px;
        }

        summary {
            cursor: pointer;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .sub-category {
            padding-left: 15px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
        }

        .promo-section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .promo-list {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
        }

        .promo-card {
            min-width: 200px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            position: relative;
            cursor: pointer;
        }

        .promo-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img-box {
            width: 100%;
            height: 140px;
            background: #f1f5f9;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            overflow: hidden;
            cursor: pointer;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .price {
            color: var(--primary);
            font-weight: bold;
            font-size: 16px;
            margin-top: 5px;
        }

        .old-price {
            color: var(--text-muted);
            text-decoration: line-through;
            font-size: 12px;
            margin-left: 5px;
        }

        .badge {
            position: absolute;
            top: 18px;
            left: 18px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 2;
        }

        .btn-delete-card {
            position: absolute;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 2;
        }

        .btn-add {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-add:hover {
            background: var(--primary-hover);
        }

        .admin-only {
            display: none;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal input, .modal select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }

        .cat-tree-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border);
        }

        .cat-tree-item.child {
            padding-left: 15px;
            font-size: 13px;
        }

        .hint-text {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        #imageModal img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
            transition: transform 0.25s ease;
            cursor: zoom-in;
        }

        #imageModal img.zoomed {
            transform: scale(1.8);
            cursor: zoom-out;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-store"></i> ร้านค้าออนไลน์</div>
        <div class="admin-controls">
            <button class="btn-lock" id="lockBtn" onclick="openPinModal()">
                <i class="fa-solid fa-lock" id="lockIcon"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar Category -->
        <div class="sidebar">
            <div class="sidebar-title">
                <span><i class="fa-solid fa-list"></i> หมวดหมู่</span>
                <button class="btn-add admin-only" onclick="openModal('catModal')"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div id="categoryTree"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="search-bar">
                <input type="text" placeholder="ค้นหาสินค้า..." oninput="filterProducts(this.value)">
                <button class="btn-add admin-only" onclick="openModal('productModal')"><i class="fa-solid fa-plus"></i> เพิ่มสินค้า</button>
            </div>

            <!-- Promotion Section -->
            <div class="promo-section">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-weight:bold;"><i class="fa-solid fa-rectangle-ad"></i> โปรโมชั่นพิเศษ</div>
                    <button class="btn-add admin-only" onclick="openModal('promoModal')"><i class="fa-solid fa-plus"></i> เพิ่มโปรโมชั่น</button>
                </div>
                <div class="promo-list" id="promoList"></div>
            </div>

            <!-- Product Grid -->
            <div class="product-grid" id="productList"></div>
        </div>
    </div>

    <!-- PIN Modal -->
    <div class="modal-overlay" id="pinModal">
        <div class="modal">
            <h3>กรอกรหัสผ่าน Admin</h3>
            <input type="password" id="pinInput" placeholder="ใส่รหัสผ่าน (1234)">
            <div class="modal-actions">
                <button onclick="closeModal('pinModal')">ยกเลิก</button>
                <button class="btn-add" onclick="verifyPin()">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- Category Modal -->
    <div class="modal-overlay" id="catModal">
        <div class="modal">
            <h3>จัดการหมวดหมู่</h3>
            <input type="text" id="newCatName" placeholder="ชื่อหมวดหมู่ใหม่">
            <select id="parentCatSelect">
                <option value="">-- เป็นหมวดหมู่หลัก (Root) --</option>
            </select>
            <button class="btn-add" onclick="addCategory()">เพิ่มหมวดหมู่</button>
            <hr>
            <h4>รายการหมวดหมู่</h4>
            <div id="adminCatTreeList" style="max-height: 200px; overflow-y: auto;"></div>
            <div class="modal-actions">
                <button onclick="closeModal('catModal')">ปิด</button>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <h3>เพิ่มสินค้าใหม่</h3>
            <input type="text" id="pName" placeholder="ชื่อสินค้า">
            <input type="number" id="pPrice" placeholder="ราคาขาย">
            <input type="number" id="pOriginalPrice" placeholder="ราคาเต็ม (ถ้ามี)">
            <input type="text" id="pBadge" placeholder="ป้ายกำกับ (เช่น ลด 50%, ขายดี)">
            <select id="pCategorySelect"></select>
            <input type="file" id="pImage" accept="image/*">
            <div class="modal-actions">
                <button onclick="closeModal('productModal')">ยกเลิก</button>
                <button class="btn-add" id="btnSaveProduct" onclick="addProduct()">บันทึกสินค้า</button>
            </div>
        </div>
    </div>

    <!-- Promo Modal -->
    <div class="modal-overlay" id="promoModal">
        <div class="modal">
            <h3>เพิ่มโปรโมชั่น</h3>
            <input type="text" id="promoTitle" placeholder="หัวข้อโปรโมชั่น">
            <input type="text" id="promoExpire" placeholder="วันหมดอายุ (เช่น 31 ธ.ค. 67)">
            <input type="file" id="promoImage" accept="image/*">
            <div class="modal-actions">
                <button onclick="closeModal('promoModal')">ยกเลิก</button>
                <button class="btn-add" id="btnSavePromo" onclick="addPromotion()">บันทึกโปรโมชั่น</button>
            </div>
        </div>
    </div>

    <!-- Image View Modal -->
    <div class="modal-overlay" id="imageModal" onclick="closeImageModal()">
        <img id="fullImage" src="" onclick="event.stopPropagation(); toggleZoomImage(this)">
    </div>

    <script>
        const SUPABASE_URL = 'https://lbpwezrhnzwierbngmls.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0N9zE7A4bkNB1rEQ82nW3A_ftwcfJZq';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allCategories = [];
        let allProducts = [];
        let allPromos = [];
        let isAdmin = localStorage.getItem('isAdmin') === 'true';

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openImageModal(url) {
            if(!url) return;
            const img = document.getElementById('fullImage');
            img.src = url;
            img.classList.remove('zoomed');
            document.getElementById('imageModal').style.display = 'flex';
        }
        
        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.getElementById('fullImage').src = '';
        }

        function toggleZoomImage(img) {
            img.classList.toggle('zoomed');
        }

        function applyAdminState() {
            if(isAdmin) {
                document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'flex');
                document.getElementById('lockBtn').classList.add('active');
                document.getElementById('lockIcon').className = 'fa-solid fa-lock-open';
            } else {
                document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'none');
                document.getElementById('lockBtn').classList.remove('active');
                document.getElementById('lockIcon').className = 'fa-solid fa-lock';
            }
            renderProducts(allProducts);
            renderPromotions(allPromos);
        }

        function openPinModal() {
            if(isAdmin) {
                isAdmin = false;
                localStorage.removeItem('isAdmin');
                applyAdminState();
            } else { 
                openModal('pinModal'); 
            }
        }

        function verifyPin() {
            if(document.getElementById('pinInput').value === '1234') {
                isAdmin = true;
                localStorage.setItem('isAdmin', 'true');
                applyAdminState();
                closeModal('pinModal');
                document.getElementById('pinInput').value = '';
            } else {
                alert('รหัสผ่านไม่ถูกต้อง');
            }
        }

        async function loadCategories() {
            const { data } = await _supabase.from('categories').select('*');
            allCategories = data || [];
            
            const pSelect = document.getElementById('pCategorySelect');
            const parentSelect = document.getElementById('parentCatSelect');
            
            pSelect.innerHTML = '<option value="">-- ไม่ระบุหมวดหมู่ --</option>';
            parentSelect.innerHTML = '<option value="">-- เป็นหมวดหมู่หลัก (Root) --</option>';

            const parents = allCategories.filter(c => !c.parent_id);

            parents.forEach(p => {
                pSelect.innerHTML += `<option value="${p.id}">📁 ${p.name}</option>`;
                parentSelect.innerHTML += `<option value="${p.id}">📁 ${p.name}</option>`;

                const children = allCategories.filter(c => c.parent_id === p.id);
                children.forEach(ch => {
                    pSelect.innerHTML += `<option value="${ch.id}">&nbsp;&nbsp;&nbsp;&nbsp;↳ 📄 ${p.name} > ${ch.name}</option>`;
                });
            });

            const treeContainer = document.getElementById('categoryTree');
            let html = '<div class="cat-item-btn" onclick="filterByCategory(null)">📋 สินค้าทั้งหมด</div>';

            parents.forEach(p => {
                const children = allCategories.filter(c => c.parent_id === p.id);
                if(children.length > 0) {
                    html += `<details open><summary>📁 ${p.name}</summary><div class="sub-category">
                        <div class="cat-item-btn" onclick="filterByCategory(${p.id})">📂 ดูทั้งหมดใน ${p.name}</div>
                        ${children.map(ch => `<div class="cat-item-btn" onclick="filterByCategory(${ch.id})">↳ 📄 ${ch.name}</div>`).join('')}
                    </div></details>`;
                } else {
                    html += `<div class="cat-item-btn" onclick="filterByCategory(${p.id})">📁 ${p.name}</div>`;
                }
            });
            treeContainer.innerHTML = html;
            renderAdminCatTree();
        }

        function renderAdminCatTree() {
            const container = document.getElementById('adminCatTreeList');
            const parents = allCategories.filter(c => !c.parent_id);
            let html = '';
            parents.forEach(p => {
                html += `<div class="cat-tree-item"><span>📁 <strong>${p.name}</strong></span><i class="fa-solid fa-trash" style="color:var(--danger); cursor:pointer;" onclick="deleteCategory(${p.id})"></i></div>`;
                allCategories.filter(c => c.parent_id === p.id).forEach(ch => {
                    html += `<div class="cat-tree-item child"><span>↳ 📄 ${ch.name}</span><i class="fa-solid fa-trash" style="color:var(--danger); cursor:pointer;" onclick="deleteCategory(${ch.id})"></i></div>`;
                });
            });
            container.innerHTML = html || 'ไม่มีหมวดหมู่';
        }

        async function loadPromotions() {
            const { data } = await _supabase.from('promotions').select('*');
            allPromos = data || [];
            renderPromotions(allPromos);
        }

        function renderPromotions(promos) {
            const container = document.getElementById('promoList');
            if(promos.length === 0) { container.innerHTML = '<div style="color:var(--text-muted); font-size:12px; padding:10px;">ไม่มีโปรโมชั่นในขณะนี้</div>'; return; }
            
            container.innerHTML = promos.map(p => `
                <div class="promo-card" onclick="openImageModal('${p.image_url}')">
                    ${isAdmin ? `<button class="btn-delete-card" onclick="event.stopPropagation(); deletePromotion(${p.id})"><i class="fa-solid fa-trash"></i></button>` : ''}
                    <img src="${p.image_url}" loading="lazy">
                    <div style="font-size:11px; opacity:0.8; margin-top:4px;">ถึง ${p.expire_date || 'ระบุ'}</div>
                    <div style="font-weight:bold; font-size:13px;">${p.title}</div>
                    <div class="hint-text"><i class="fa-solid fa-magnifying-glass-plus"></i> กดเพื่อดูรูปใหญ่</div>
                </div>
            `).join('');
        }

        async function loadProducts() {
            const { data } = await _supabase.from('products').select('*');
            allProducts = data || [];
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productList');
            if(products.length === 0) { grid.innerHTML = '<div style="grid-column: span 2; text-align:center; color:#888;">ไม่พบสินค้า</div>'; return; }

            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    ${isAdmin ? `<button class="btn-delete-card" style="top:5px; right:5px;" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>` : ''}
                    ${p.badge_label ? `<span class="badge">${p.badge_label}</span>` : ''}
                    
                    <div class="product-img-box" onclick="openImageModal('${p.image_url || ''}')">
                        ${p.image_url 
                            ? `<img src="${p.image_url}" loading="lazy" alt="${p.name}">` 
                            : `<i class="fa-solid fa-box-open fa-2x" style="color:#a8a29e;"></i>`}
                    </div>

                    <div style="font-size:13px; font-weight:bold;">${p.name}</div>
                    <div class="price">฿${p.price} ${p.original_price ? `<span class="old-price">฿${p.original_price}</span>` : ''}</div>
                </div>
            `).join('');
        }

        function filterByCategory(catId) {
            if(!catId) {
                renderProducts(allProducts);
                return;
            }
            
            const childCatIds = allCategories.filter(c => c.parent_id === catId).map(c => c.id);
            const targetCatIds = [catId, ...childCatIds];

            renderProducts(allProducts.filter(p => targetCatIds.includes(p.category_id)));
        }

        function filterProducts(keyword) {
            renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(keyword.toLowerCase())));
        }

        async function addCategory() {
            const name = document.getElementById('newCatName').value;
            const parent_id = document.getElementById('parentCatSelect').value || null;
            if(!name) return alert('ใส่ชื่อหมวดหมู่');

            const { error } = await _supabase.from('categories').insert([{ name, parent_id }]);
            if (error) alert('เพิ่มหมวดหมู่ไม่สำเร็จ: ' + error.message);
            else {
                document.getElementById('newCatName').value = '';
                loadCategories();
            }
        }

        async function deleteCategory(id) {
            if(!confirm('ยืนยันการลบหมวดหมู่นี้?')) return;

            // Step 1: ปลดความสัมพันธ์ของหมวดหมู่อย่อยให้กลายเป็น null ก่อน
            await _supabase.from('categories').update({ parent_id: null }).eq('parent_id', id);

            // Step 2: ปลดสินค้าในหมวดหมู่นี้ให้กลายเป็นไม่มีหมวดหมู่ (null) ก่อน
            await _supabase.from('products').update({ category_id: null }).eq('category_id', id);

            // Step 3: สั่งลบหมวดหมู่
            const { error } = await _supabase.from('categories').delete().eq('id', id);
            
            if (error) {
                alert('ลบหมวดหมู่ไม่สำเร็จ: ' + error.message);
            } else {
                loadCategories();
                loadProducts();
            }
        }

        async function addProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const original_price = document.getElementById('pOriginalPrice').value || null;
            const badge_label = document.getElementById('pBadge').value;
            const category_id = document.getElementById('pCategorySelect').value || null;
            const file = document.getElementById('pImage').files[0];

            if(!name || !price) return alert('กรอกชื่อและราคา');

            const saveBtn = document.getElementById('btnSaveProduct');
            saveBtn.disabled = true;
            saveBtn.innerText = 'กำลังบันทึก...';

            let image_url = null;

            if (file) {
                const fileName = 'product_' + Date.now() + '_' + file.name;
                const { error: uploadErr } = await _supabase.storage.from('images').upload(fileName, file);
                
                if (uploadErr) {
                    alert('อัปโหลดรูปภาพไม่สำเร็จ: ' + uploadErr.message);
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'บันทึกสินค้า';
                    return;
                }

                const { data: { publicUrl } } = _supabase.storage.from('images').getPublicUrl(fileName);
                image_url = publicUrl;
            }

            const { error } = await _supabase.from('products').insert([{ 
                name, price, original_price, badge_label, category_id, image_url 
            }]);

            saveBtn.disabled = false;
            saveBtn.innerText = 'บันทึกสินค้า';

            if (error) {
                alert('เพิ่มสินค้าไม่สำเร็จ: ' + error.message);
            } else {
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pOriginalPrice').value = '';
                document.getElementById('pBadge').value = '';
                document.getElementById('pImage').value = '';
                closeModal('productModal');
                loadProducts();
            }
        }

        async function deleteProduct(id) {
            if(!confirm('ยืนยันลบสินค้านี้?')) return;
            const { error } = await _supabase.from('products').delete().eq('id', id);
            if (error) alert('ลบสินค้าไม่สำเร็จ: ' + error.message);
            else loadProducts();
        }

        async function addPromotion() {
            const title = document.getElementById('promoTitle').value;
            const expire_date = document.getElementById('promoExpire').value;
            const file = document.getElementById('promoImage').files[0];

            if(!title || !file) return alert('กรอกข้อมูลให้ครบ');
            
            const saveBtn = document.getElementById('btnSavePromo');
            saveBtn.disabled = true;
            saveBtn.innerText = 'กำลังบันทึก...';

            const fileName = 'promo_' + Date.now() + '_' + file.name;
            const { error: uploadErr } = await _supabase.storage.from('images').upload(fileName, file);
            
            if(uploadErr) {
                alert('อัปโหลดรูปไม่สำเร็จ: ' + uploadErr.message);
                saveBtn.disabled = false;
                saveBtn.innerText = 'บันทึกโปรโมชั่น';
                return;
            }

            const { data: { publicUrl } } = _supabase.storage.from('images').getPublicUrl(fileName);
            const { error } = await _supabase.from('promotions').insert([{ title, expire_date, image_url: publicUrl }]);

            saveBtn.disabled = false;
            saveBtn.innerText = 'บันทึกโปรโมชั่น';

            if (error) alert('เพิ่มโปรโมชั่นไม่สำเร็จ: ' + error.message);
            else {
                document.getElementById('promoTitle').value = '';
                document.getElementById('promoExpire').value = '';
                document.getElementById('promoImage').value = '';
                closeModal('promoModal');
                loadPromotions();
            }
        }

        async function deletePromotion(id) {
            if(!confirm('ยืนยันลบโปรโมชั่นนี้?')) return;
            const { error } = await _supabase.from('promotions').delete().eq('id', id);
            if (error) alert('ลบโปรโมชั่นไม่สำเร็จ: ' + error.message);
            else loadPromotions();
        }

        applyAdminState();
        loadCategories();
        loadPromotions();
        loadProducts();
    </script>
</body>
</html>
