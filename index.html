<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านค้าของฉัน</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 50px; }
        header { background: #fff; padding: 15px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index: 10; }
        .btn-lock { background: #f1f5f9; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; }
        .btn-lock.active { background: #dbeafe; color: var(--primary); }
        .main-layout { display: flex; gap: 20px; padding: 20px; max-width: 1200px; margin: auto; }
        .sidebar { width: 250px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; height: fit-content; }
        .content { flex: 1; }
        .search-bar { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; }
        .promo-container { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .promo-card { min-width: 150px; background: #fff; border: 1px solid #eee; padding: 5px; border-radius: 6px; text-align: center; position: relative; cursor: pointer; }
        .promo-card img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .product-card { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 10px; position: relative; }
        .product-img-box { width: 100%; height: 120px; background: #f5f5f5; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
        .product-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .badge { position: absolute; top: 15px; left: 15px; background: var(--danger); color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; z-index: 1; }
        .price { color: var(--primary); font-weight: bold; margin-top: 5px; }
        .old-price { text-decoration: line-through; color: #999; font-size: 11px; font-weight: normal; }
        .cat-item-btn { padding: 6px; cursor: pointer; border-radius: 4px; }
        .cat-item-btn:hover { background: #f0f0f0; }
        .sub-category { padding-left: 15px; }
        .admin-only { display: none; }
        .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal { background: #fff; padding: 20px; border-radius: 8px; width: 300px; display: flex; flex-direction: column; gap: 10px; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-delete-card { position: absolute; top: 5px; right: 5px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; z-index: 2; }
        .cat-tree-item { display: flex; justify-content: space-between; padding: 4px 0; }
        .cat-tree-item.child { padding-left: 15px; }
        .hint-text { font-size: 10px; color: #888; margin-top: 2px; }
        
        #imageModal img { max-width: 90vw; max-height: 90vh; border-radius: 8px; transition: transform 0.25s ease; cursor: zoom-in; }
        #imageModal img.zoomed { transform: scale(1.8); cursor: zoom-out; }
    </style>
</head>
<body>

    <header>
        <h2><i class="fa-solid fa-shop"></i> My Store</h2>
        <button class="btn-lock" id="lockBtn" onclick="openPinModal()">
            <i class="fa-solid fa-lock" id="lockIcon"></i>
        </button>
    </header>

    <div class="main-layout">
        <div class="sidebar">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <b>หมวดหมู่</b>
                <button class="btn-add admin-only" onclick="openModal('catModal')">+</button>
            </div>
            <div id="categoryTree"></div>
        </div>

        <div class="content">
            <input type="text" class="search-bar" placeholder="ค้นหาสินค้า..." oninput="filterProducts(this.value)">

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                <b>โปรโมชั่น</b>
                <button class="btn-add admin-only" onclick="openModal('promoModal')">+ โปรโมชั่น</button>
            </div>
            <div class="promo-container" id="promoList"></div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <b>สินค้าทั้งหมด</b>
                <button class="btn-add admin-only" onclick="openModal('productModal')">+ สินค้า</button>
            </div>
            <div class="product-grid" id="productList"></div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="pinModal">
        <div class="modal">
            <h3>Admin PIN</h3>
            <input type="password" id="pinInput" placeholder="รหัสผ่าน">
            <button class="btn-add" onclick="verifyPin()">ยืนยัน</button>
            <button onclick="closeModal('pinModal')">ยกเลิก</button>
        </div>
    </div>

    <div class="modal-overlay" id="catModal">
        <div class="modal">
            <h3>หมวดหมู่</h3>
            <input type="text" id="newCatName" placeholder="ชื่อหมวดหมู่">
            <select id="parentCatSelect"><option value="">-- หมวดหมู่หลัก --</option></select>
            <button class="btn-add" onclick="addCategory()">บันทึก</button>
            <hr>
            <div id="adminCatTreeList" style="max-height: 150px; overflow-y: auto;"></div>
            <button onclick="closeModal('catModal')">ปิด</button>
        </div>
    </div>

    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <h3>เพิ่มสินค้า</h3>
            <input type="text" id="pName" placeholder="ชื่อสินค้า">
            <input type="number" id="pPrice" placeholder="ราคา">
            <input type="number" id="pOriginalPrice" placeholder="ราคาเดิม">
            <input type="text" id="pBadge" placeholder="ป้ายกำกับ">
            <select id="pCategorySelect"></select>
            <input type="file" id="pImage">
            <button class="btn-add" id="btnSaveProduct" onclick="addProduct()">บันทึก</button>
            <button onclick="closeModal('productModal')">ยกเลิก</button>
        </div>
    </div>

    <div class="modal-overlay" id="promoModal">
        <div class="modal">
            <h3>เพิ่มโปรโมชั่น</h3>
            <input type="text" id="promoTitle" placeholder="หัวข้อ">
            <input type="text" id="promoExpire" placeholder="วันหมดอายุ">
            <input type="file" id="promoImage">
            <button class="btn-add" id="btnSavePromo" onclick="addPromotion()">บันทึก</button>
            <button onclick="closeModal('promoModal')">ยกเลิก</button>
        </div>
    </div>

    <div class="modal-overlay" id="imageModal" onclick="closeImageModal()">
        <img id="fullImage" src="" onclick="event.stopPropagation(); toggleZoomImage(this)">
    </div>

    <script>
        const SUPABASE_URL = 'https://lbpwezrhnzwierbngmls.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0N9zE7A4bkNB1rEQ82nW3A_ftwcfJZq';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allCategories = [];
        let allProducts = [];
        let allPromos = [];
        let isAdmin = localStorage.getItem('isAdmin') === 'true';

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openImageModal(url) {
            if(!url) return;
            const img = document.getElementById('fullImage');
            img.src = url;
            img.classList.remove('zoomed');
            document.getElementById('imageModal').style.display = 'flex';
        }
        
        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.getElementById('fullImage').src = '';
        }

        function toggleZoomImage(img) {
            img.classList.toggle('zoomed');
        }

        function applyAdminState() {
            if(isAdmin) {
                document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'inline-block');
                document.getElementById('lockBtn').classList.add('active');
                document.getElementById('lockIcon').className = 'fa-solid fa-lock-open';
            } else {
                document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'none');
                document.getElementById('lockBtn').classList.remove('active');
                document.getElementById('lockIcon').className = 'fa-solid fa-lock';
            }
            renderProducts(allProducts);
            renderPromotions(allPromos);
        }

        function openPinModal() {
            if(isAdmin) {
                isAdmin = false;
                localStorage.removeItem('isAdmin');
                applyAdminState();
            } else { 
                openModal('pinModal'); 
            }
        }

        function verifyPin() {
            if(document.getElementById('pinInput').value === '1234') {
                isAdmin = true;
                localStorage.setItem('isAdmin', 'true');
                applyAdminState();
                closeModal('pinModal');
                document.getElementById('pinInput').value = '';
            } else {
                alert('รหัสผ่านไม่ถูกต้อง');
            }
        }

        async function loadCategories() {
            const { data } = await _supabase.from('categories').select('*');
            allCategories = data || [];
            
            const pSelect = document.getElementById('pCategorySelect');
            const parentSelect = document.getElementById('parentCatSelect');
            
            pSelect.innerHTML = '<option value="">-- ไม่ระบุหมวดหมู่ --</option>';
            parentSelect.innerHTML = '<option value="">-- หมวดหมู่หลัก --</option>';

            const parents = allCategories.filter(c => !c.parent_id);

            parents.forEach(p => {
                pSelect.innerHTML += `<option value="${p.id}">📁 ${p.name}</option>`;
                parentSelect.innerHTML += `<option value="${p.id}">📁 ${p.name}</option>`;

                const children = allCategories.filter(c => c.parent_id === p.id);
                children.forEach(ch => {
                    pSelect.innerHTML += `<option value="${ch.id}">&nbsp;&nbsp;↳ 📄 ${ch.name}</option>`;
                });
            });

            const treeContainer = document.getElementById('categoryTree');
            let html = '<div class="cat-item-btn" onclick="filterByCategory(null)">📋 ทั้งหมด</div>';

            parents.forEach(p => {
                const children = allCategories.filter(c => c.parent_id === p.id);
                if(children.length > 0) {
                    html += `<details open><summary>📁 ${p.name}</summary><div class="sub-category">
                        <div class="cat-item-btn" onclick="filterByCategory(${p.id})">📂 ดูทั้งหมด</div>
                        ${children.map(ch => `<div class="cat-item-btn" onclick="filterByCategory(${ch.id})">↳ 📄 ${ch.name}</div>`).join('')}
                    </div></details>`;
                } else {
                    html += `<div class="cat-item-btn" onclick="filterByCategory(${p.id})">📁 ${p.name}</div>`;
                }
            });
            treeContainer.innerHTML = html;
            renderAdminCatTree();
        }

        function renderAdminCatTree() {
            const container = document.getElementById('adminCatTreeList');
            const parents = allCategories.filter(c => !c.parent_id);
            let html = '';
            parents.forEach(p => {
                html += `<div class="cat-tree-item"><span>📁 <strong>${p.name}</strong></span><i class="fa-solid fa-trash" style="color:var(--danger); cursor:pointer;" onclick="deleteCategory(${p.id})"></i></div>`;
                allCategories.filter(c => c.parent_id === p.id).forEach(ch => {
                    html += `<div class="cat-tree-item child"><span>↳ 📄 ${ch.name}</span><i class="fa-solid fa-trash" style="color:var(--danger); cursor:pointer;" onclick="deleteCategory(${ch.id})"></i></div>`;
                });
            });
            container.innerHTML = html || 'ไม่มีหมวดหมู่';
        }

        async function loadPromotions() {
            const { data } = await _supabase.from('promotions').select('*');
            allPromos = data || [];
            renderPromotions(allPromos);
        }

        function renderPromotions(promos) {
            const container = document.getElementById('promoList');
            if(promos.length === 0) { container.innerHTML = '<div style="color:#888; font-size:12px;">ไม่มีโปรโมชั่น</div>'; return; }
            
            container.innerHTML = promos.map(p => `
                <div class="promo-card" onclick="openImageModal('${p.image_url}')">
                    ${isAdmin ? `<button class="btn-delete-card" onclick="event.stopPropagation(); deletePromotion(${p.id})">×</button>` : ''}
                    <img src="${p.image_url}" loading="lazy">
                    <div style="font-size:10px; color:#666;">ถึง ${p.expire_date || '-'}</div>
                    <div style="font-size:12px; font-weight:bold;">${p.title}</div>
                    <div class="hint-text"><i class="fa-solid fa-magnifying-glass-plus"></i> ขยาย</div>
                </div>
            `).join('');
        }

        async function loadProducts() {
            const { data } = await _supabase.from('products').select('*');
            allProducts = data || [];
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productList');
            if(products.length === 0) { grid.innerHTML = '<div style="color:#888;">ไม่พบสินค้า</div>'; return; }

            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    ${isAdmin ? `<button class="btn-delete-card" onclick="deleteProduct(${p.id})">×</button>` : ''}
                    ${p.badge_label ? `<span class="badge">${p.badge_label}</span>` : ''}
                    
                    <div class="product-img-box" onclick="openImageModal('${p.image_url || ''}')">
                        ${p.image_url 
                            ? `<img src="${p.image_url}" loading="lazy">` 
                            : `<i class="fa-solid fa-box fa-2x" style="color:#ccc;"></i>`}
                    </div>

                    <div style="font-size:13px; font-weight:bold; margin-top:5px;">${p.name}</div>
                    <div class="price">฿${p.price} ${p.original_price ? `<span class="old-price">฿${p.original_price}</span>` : ''}</div>
                </div>
            `).join('');
        }

        function filterByCategory(catId) {
            if(!catId) {
                renderProducts(allProducts);
                return;
            }
            
            const childCatIds = allCategories.filter(c => c.parent_id === catId).map(c => c.id);
            const targetCatIds = [catId, ...childCatIds];

            renderProducts(allProducts.filter(p => targetCatIds.includes(p.category_id)));
        }

        function filterProducts(keyword) {
            renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(keyword.toLowerCase())));
        }

        async function addCategory() {
            const name = document.getElementById('newCatName').value;
            const parent_id = document.getElementById('parentCatSelect').value || null;
            if(!name) return alert('ใส่ชื่อหมวดหมู่');

            const { error } = await _supabase.from('categories').insert([{ name, parent_id }]);
            if (error) alert('ผิดพลาด: ' + error.message);
            else {
                document.getElementById('newCatName').value = '';
                loadCategories();
            }
        }

        async function deleteCategory(id) {
            if(!confirm('ยืนยันลบหมวดหมู่นี้?')) return;

            // ปลดความสัมพันธ์ของ Sub-category และ Product ก่อนลบ
            await _supabase.from('categories').update({ parent_id: null }).eq('parent_id', id);
            await _supabase.from('products').update({ category_id: null }).eq('category_id', id);

            const { error } = await _supabase.from('categories').delete().eq('id', id);
            
            if (error) {
                alert('ลบไม่สำเร็จ: ' + error.message);
            } else {
                loadCategories();
                loadProducts();
            }
        }

        async function addProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const original_price = document.getElementById('pOriginalPrice').value || null;
            const badge_label = document.getElementById('pBadge').value;
            const category_id = document.getElementById('pCategorySelect').value || null;
            const file = document.getElementById('pImage').files[0];

            if(!name || !price) return alert('กรอกชื่อและราคา');

            const saveBtn = document.getElementById('btnSaveProduct');
            saveBtn.disabled = true;
            saveBtn.innerText = 'บันทึก...';

            let image_url = null;

            if (file) {
                const fileName = 'product_' + Date.now() + '_' + file.name;
                const { error: uploadErr } = await _supabase.storage.from('images').upload(fileName, file);
                
                if (uploadErr) {
                    alert('รูปอัปโหลดไม่สำเร็จ: ' + uploadErr.message);
                    saveBtn.disabled = false;
                    saveBtn.innerText = 'บันทึก';
                    return;
                }

                const { data: { publicUrl } } = _supabase.storage.from('images').getPublicUrl(fileName);
                image_url = publicUrl;
            }

            const { error } = await _supabase.from('products').insert([{ 
                name, price, original_price, badge_label, category_id, image_url 
            }]);

            saveBtn.disabled = false;
            saveBtn.innerText = 'บันทึก';

            if (error) {
                alert('ผิดพลาด: ' + error.message);
            } else {
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pOriginalPrice').value = '';
                document.getElementById('pBadge').value = '';
                document.getElementById('pImage').value = '';
                closeModal('productModal');
                loadProducts();
            }
        }

        async function deleteProduct(id) {
            if(!confirm('ยืนยันลบสินค้านี้?')) return;
            const { error } = await _supabase.from('products').delete().eq('id', id);
            if (error) alert('ลบไม่สำเร็จ: ' + error.message);
            else loadProducts();
        }

        async function addPromotion() {
            const title = document.getElementById('promoTitle').value;
            const expire_date = document.getElementById('promoExpire').value;
            const file = document.getElementById('promoImage').files[0];

            if(!title || !file) return alert('กรอกข้อมูลให้ครบ');
            
            const saveBtn = document.getElementById('btnSavePromo');
            saveBtn.disabled = true;
            saveBtn.innerText = 'บันทึก...';

            const fileName = 'promo_' + Date.now() + '_' + file.name;
            const { error: uploadErr } = await _supabase.storage.from('images').upload(fileName, file);
            
            if(uploadErr) {
                alert('อัปโหลดไม่สำเร็จ: ' + uploadErr.message);
                saveBtn.disabled = false;
                saveBtn.innerText = 'บันทึก';
                return;
            }

            const { data: { publicUrl } } = _supabase.storage.from('images').getPublicUrl(fileName);
            const { error } = await _supabase.from('promotions').insert([{ title, expire_date, image_url: publicUrl }]);

            saveBtn.disabled = false;
            saveBtn.innerText = 'บันทึก';

            if (error) alert('ผิดพลาด: ' + error.message);
            else {
                document.getElementById('promoTitle').value = '';
                document.getElementById('promoExpire').value = '';
                document.getElementById('promoImage').value = '';
                closeModal('promoModal');
                loadPromotions();
            }
        }

        async function deletePromotion(id) {
            if(!confirm('ยืนยันลบโปรโมชั่น?')) return;
            const { error } = await _supabase.from('promotions').delete().eq('id', id);
            if (error) alert('ลบไม่สำเร็จ: ' + error.message);
            else loadPromotions();
        }

        applyAdminState();
        loadCategories();
        loadPromotions();
        loadProducts();
    </script>
</body>
</html>
